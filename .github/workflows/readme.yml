name: README
run-name: Atualizar READMEs (${{ github.actor }})

on:
  push:
    branches: [main]
    paths:
      - content/**
      - scripts/**
      - package.json
  workflow_dispatch:

permissions:
  contents: write

# Mesmo grupo do release: os dois escrevem na main, então rodam um de cada vez.
concurrency:
  group: main-writes
  cancel-in-progress: false

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build:readme
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Commitar se algo mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.en.md
          if git diff --cached --quiet; then
            echo "READMEs já estão atualizados."
          else
            git commit -m "docs: atualiza READMEs gerados [skip ci]"
            git push
          fi
